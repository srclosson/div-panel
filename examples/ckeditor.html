<!--
  This example displays a ckeditor in edit mode, allowing you to edit your panel layout in a GUI. Then, when you exit
  edit mode, the HTML produced by ckeditor is displayed.
-->
<html>
  <head>
    <script src="https://cdn.ckeditor.com/ckeditor5/18.0.0/classic/ckeditor.js"></script>
  </head>
  <body>
    <div id="ckeditor" contenteditable="false"></div>
    <script>
        function onDivPanelInit(elem, content) {
          // Outside edit mode, show what was saved the last time someone edited the panel.
          document.getElementById('ckeditor').innerHTML = content;
        }
        function onDivPanelEnterEditMode(elem, content) {
          console.log("I entered edit mode", elem, window.ckedit);
          if (!window.ckedit) {
            ClassicEditor.create(document.getElementById('ckeditor'))
            .then(editor => {
              editor.setData(content);
              window.ckedit = editor;
            })
            .catch(error => {
              console.error( error );
            });
          }
        }
        function onDivPanelExitEditMode(elem) {
          let html = '';
          if (window.ckedit) {
            const editor = window.ckedit;
            window.ckedit = null;
            html = editor.getData();
            // destroy() leaves the original element empty, so show the saved html again.
            editor.destroy().then(() => {
              document.getElementById('ckeditor').innerHTML = html;
            });
          }
          return html;
        }
        function onDivPanelDataUpdate(data) {
          console.log("I have data", data);
        }
        console.log("Hello from my script!", this.command);
    </script>
  </body>
</html>
